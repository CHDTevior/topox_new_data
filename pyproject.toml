[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "topox-ktjd17"
version = "1.0.0"
description = "Lossless KTJD-17 multi-topology motion data tools"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=9.0",
  "huggingface_hub>=0.36",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
