[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topox-new-data"
version = "0.1.0"
description = "Audited KTJD-17 multi-topology data conversion and validation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=9.0",
  "huggingface_hub>=0.36",
]

[tool.setuptools]
packages = ["src", "src.data", "src.data.ktjd17"]
